<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Citizenship Interview Practice</title>
<style>
:root{
  --ink:#14233a; --muted:#4a5870; --bg:#f4f1ea; --card:#fff; --navy:#1f3a5f; --navy2:#27507f;
  --ok:#17663a; --okbg:#e6f4ec; --bad:#a3231c; --badbg:#fbeaea; --warn:#6f4800; --warnbg:#fff4d6; --line:#cfc8b8;
  --r:1rem; --shadow:0 2px 0 rgba(20,35,58,.06),0 8px 24px rgba(20,35,58,.08);
}
*{box-sizing:border-box}
html{font-size:112.5%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{max-width:40rem;margin:0 auto;min-height:100vh;min-height:100dvh}
.screen{padding:1rem 1rem 3rem;display:flex;flex-direction:column;gap:.8rem}
h1{font-size:1.6rem;line-height:1.2;margin:.2rem 0}
h2{font-size:1.3rem;line-height:1.25;margin:.3rem 0}
h3{font-size:1.1rem;margin:0}
p{margin:0}
.lead{font-size:1.1rem}
.fine{font-size:.85rem;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--navy2)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #b4520a;outline-offset:3px;border-radius:.4rem}
[tabindex="-1"]:focus{outline:none}
.big{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.4rem;padding:.7rem 1rem;border-radius:var(--r);border:2px solid var(--navy);background:var(--card);color:var(--navy);font-size:1.1rem;font-weight:650;text-align:center}
.big.primary{background:var(--navy);color:#fff}
.big.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.big.bad{border-color:var(--bad);color:var(--bad)}
.big:disabled{border-color:#8a94a6;color:#5b6577;background:#e9e6de;cursor:not-allowed}
.big[aria-pressed="true"]{background:var(--navy);color:#fff}
.big small{display:block;font-weight:400;font-size:.85rem}
.big.col{flex-direction:column;gap:.1rem}
.link{background:none;border:0;color:var(--navy2);text-decoration:underline;font-size:1rem;padding:.75rem .6rem;min-height:2.75rem}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.75rem}
.back{border:2px solid var(--navy);background:var(--card);color:var(--navy);border-radius:999px;min-height:2.75rem;padding:.3rem 1rem;font-weight:650}
.lang select{min-height:2.75rem;border-radius:.6rem;border:2px solid var(--navy);background:#fff;padding:.2rem .5rem;max-width:12rem}
.privacy{background:#eef4fb;border-left:.35rem solid var(--navy2);border-radius:.6rem;padding:.7rem .8rem;font-size:.95rem}
.warn{background:var(--warnbg);color:var(--warn);border-radius:.8rem;padding:.7rem .9rem}
.note{background:#eef4fb;border-radius:.8rem;padding:.7rem .9rem}

.check{display:flex;gap:.7rem;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:.8rem;padding:.8rem;min-height:3rem}
.check input{width:1.5rem;height:1.5rem;flex:none;margin-top:.1rem}
.stack{display:grid;gap:.7rem}
/* Interview */
.ibar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.chip{background:var(--navy);color:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:650}
.mode{font-size:.8rem;color:var(--muted);font-weight:650;flex:1;min-width:6rem}
.stop{margin-left:auto;border:2px solid var(--navy);background:var(--card);color:var(--navy);border-radius:999px;min-height:2.75rem;padding:.3rem .9rem;font-weight:650;font-size:.9rem}
.progress{height:.4rem;background:#ddd6c6;border-radius:.4rem;overflow:hidden}
.progress>div{height:100%;background:var(--navy2)}
.officer-row{display:flex;gap:.7rem;align-items:flex-start;flex-wrap:wrap}

.minor{display:flex;justify-content:center;flex-wrap:wrap}
.listen{display:flex;align-items:center;gap:.6rem;justify-content:center;font-weight:650;color:var(--bad);font-size:1.1rem}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,35,58,.6);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9;overflow:auto}
.modal .card{background:#fff;border-radius:1.2rem;padding:1.2rem;width:100%;max-width:26rem;display:grid;gap:.8rem}
/* Results */
.rcard{background:var(--card);border-radius:1rem;padding:1rem;box-shadow:var(--shadow);border-left:.4rem solid var(--navy2);display:grid;gap:.5rem}
.rcard ul,.rcard ol{padding-left:1.3rem;margin:.2rem 0}
.rcard li{margin:.4rem 0;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:.1rem .6rem;background:#e8eef6;color:var(--navy)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.chk{background:var(--warnbg);color:var(--warn)}

@media (min-width:44rem){.officer-wrap{width:5rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<main id="app"></main>
<div id="live" class="vh" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Please turn on JavaScript to use this practice page.</p></noscript>
<script>/* Interview engine: pure logic, no browser APIs. Works in the browser and in Node (for tests). */
(function (root) {
  'use strict';

  // ---------- Text normalization ----------
  const ONES = { zero:0, oh:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10,
    eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 };
  const TENS = { twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 };
  const ORD = { first:1, second:2, third:3, fourth:4, fifth:5, sixth:6, seventh:7, eighth:8, ninth:9, tenth:10,
    eleventh:11, twelfth:12, thirteenth:13, fourteenth:14, fifteenth:15, sixteenth:16, seventeenth:17,
    eighteenth:18, nineteenth:19, twentieth:20, thirtieth:30 };
  const NUMWORD = Object.assign({}, ONES, TENS, { hundred: 'H', thousand: 'T' });

  // Phrase-level canonicalization (applied to both the student's answer and the official answer)
  const PHRASES = [
    [/\bunited states of america\b/g, ' usa '], [/\bunited states\b/g, ' usa '], [/\bu ?s ?a\b/g, ' usa '],
    [/\bu s\b/g, ' usa '], [/\bus\b/g, ' usa '], [/\bamerica\b/g, ' usa '],
    [/\bwashington d ?c\b/g, ' washington dc '], [/\bd ?c\b/g, ' dc '], [/\bdistrict of columbia\b/g, ' dc '],
    [/\bworld war (?:ii|2|two)\b/g, ' ww2 '], [/\bsecond world war\b/g, ' ww2 '], [/\bww ?ii\b/g, ' ww2 '],
    [/\bworld war (?:i|1|one)\b/g, ' ww1 '], [/\bfirst world war\b/g, ' ww1 '], [/\bww ?i\b/g, ' ww1 '], [/\bwwii\b/g,' ww2 '], [/\bwwi\b/g,' ww1 '],
    [/\bmexican american\b/g, ' mexicanamerican '], [/\bspanish american\b/g, ' spanishamerican '], [/\bmlk\b/g, ' martin luther king '], [/\bfdr\b/g, ' franklin roosevelt '],
    [/\bsoviet union\b/g, ' ussr '], [/\bu ?s ?s ?r\b/g, ' ussr '], [/\brussia\b/g, ' ussr '],
    [/\bnative americans?\b/g, ' american indian '], [/\bamerican indians?\b/g, ' american indian '], [/\bindians\b/g,' indian '],
    [/\bbritain\b/g, ' british '], [/\bengland\b/g, ' british '], [/\bgreat british\b/g, ' british '], [/\bbritish empire\b/g,' british '], [/\bthe uk\b/g,' british '], [/\bthe king\b/g, ' british '],
    [/\bself government\b/g, ' selfgovernment '], [/\bgovern themselves\b/g, ' selfgovernment '], [/\bgovern ourselves\b/g, ' selfgovernment '],
    [/\bvice president\b/g, ' vicepresident '], [/\bnew year s day\b/g, ' new year '], [/\bnew years day\b/g,' new year '], [/\bnew years\b/g, ' new year '],
    [/\bpresidents day\b/g, ' presidentsday '], [/\bpresident s day\b/g, ' presidentsday '], [/\bwashington s birthday\b/g, ' presidentsday '],
    [/\bthanksgiving day\b/g, ' thanksgiving '], [/\bchristmas day\b/g, ' christmas '],
    [/\bfourth of july\b/g, ' july 4 '], [/\bnobody\b/g, ' no one '], [/\bno body\b/g, ' no one '], [/\bjuly fourth\b/g, ' july 4 '], [/\bjuly the fourth\b/g, ' july 4 '],
    [/\bsupreme court\b/g, ' supremecourt '], [/\bcheck and balance\b/g, ' checks balances '],
    [/\bstar spangled banner\b/g, ' starspangled banner '], [/\bstar spangle banner\b/g, ' starspangled banner '],
    [/\bcapitalist\b/g, ' capitalism '], [/\bfree market\b/g, ' freemarket '], [/\bmarket economy\b/g, ' freemarket economy '],
    [/\bpearl harbour\b/g, ' pearl harbor '], [/\bcommunist\b/g, ' communism '],
    [/\bdon t\b/g, ' dont '], [/\bdidn t\b/g, ' didnt '], [/\bdoesn t\b/g, ' doesnt '], [/\bcan t\b/g, ' cant '], [/\bwon t\b/g, ' wont '],
    [/\bhaven t\b/g, ' havent '], [/\bhasn t\b/g, ' hasnt '], [/\bwasn t\b/g, ' wasnt '], [/\bweren t\b/g, ' werent '], [/\bisn t\b/g, ' isnt '], [/\baren t\b/g, ' arent '],
    [/\bi m\b/g, ' i am '], [/\bit s\b/g, ' it is '], [/\bthat s\b/g, ' that is '], [/\bi ve\b/g, ' i have '],
  ];

  function wordsToNumbers(tokens) {
    // converts sequences like "four hundred thirty five" -> "435", "seventeen seventy six" -> "1776"
    const out = [];
    let i = 0;
    while (i < tokens.length) {
      const t = tokens[i];
      if (t in ONES || t in TENS || (t === 'hundred' && out.length) ) {
        // collect a run
        let run = [];
        while (i < tokens.length && (tokens[i] in ONES || tokens[i] in TENS || tokens[i] === 'hundred' || tokens[i] === 'thousand' || (tokens[i] === 'and' && run.length && i + 1 < tokens.length && (tokens[i+1] in ONES || tokens[i+1] in TENS)))) {
          if (tokens[i] !== 'and') run.push(tokens[i]);
          i++;
        }
        out.push(String(parseRun(run)));
        continue;
      }
      out.push(t); i++;
    }
    return out;
  }
  function parseRun(run) {
    // Year-style: two 2-digit groups with no hundred/thousand ("seventeen seventy six")
    if (!run.includes('hundred') && !run.includes('thousand')) {
      const groups = []; let cur = null;
      for (const w of run) {
        if (w in TENS) { if (cur !== null) groups.push(cur); cur = TENS[w]; }
        else if (w in ONES) {
          if (cur !== null && cur % 10 === 0 && cur >= 20 && ONES[w] < 10) { cur += ONES[w]; groups.push(cur); cur = null; }
          else { if (cur !== null) groups.push(cur); cur = ONES[w]; if (ONES[w] >= 10) { groups.push(cur); cur = null; } }
        }
      }
      if (cur !== null) groups.push(cur);
      if (groups.length === 1) return groups[0];
      if (groups.length === 2 && groups[0] >= 10 && groups[0] <= 20) return groups[0] * 100 + groups[1]; // 1776, 1803, 2001 style
      if (groups.length === 3 && groups[0] >= 10 && groups[1] === 0) return groups[0] * 100 + groups[2]; // "eighteen oh three"
      return groups.join('');
    }
    let total = 0, cur = 0;
    for (const w of run) {
      if (w in ONES) cur += ONES[w];
      else if (w in TENS) cur += TENS[w];
      else if (w === 'hundred') cur = (cur || 1) * 100;
      else if (w === 'thousand') { total += (cur || 1) * 1000; cur = 0; }
    }
    return total + cur;
  }

  function normalize(s) {
    if (!s) return '';
    s = String(s).toLowerCase()
      .replace(/[‘’ʼ`]/g, "'").replace(/[“”]/g, '"')
      .replace(/(\d)(st|nd|rd|th)\b/g, '$1')
      .replace(/(\d),(\d{3})/g, '$1$2')
      .replace(/[^a-z0-9' ]+/g, ' ')
      .replace(/'/g, ' ');
    s = ' ' + s.replace(/\s+/g, ' ') + ' ';
    // ordinals as words -> digits (e.g., "fourth" -> 4) except inside fixed phrases handled above
    for (const [re, rep] of PHRASES) s = s.replace(re, rep);
    let toks = s.trim().split(/\s+/).filter(Boolean);
    toks = toks.map(t => (t in ORD && !['first','second'].includes(t)) ? String(ORD[t]) : t);
    toks = wordsToNumbers(toks);
    return toks.join(' ');
  }

  const STOP = new Set(('a an the of to in is are was were be been it its this that these those and or for by on at as with from ' +
    'they them their there we our us you your he she his her i me my do does did has have had will would can could should ' +
    'so one thing part um uh uhm hmm er ah well okay ok like just think maybe answer believe guess know say says said ' +
    'name named called call very really also then because if into than what who whom which when where why how').split(' '));
  // words that matter even though short
  const KEEP = new Set(['no', 'not', 'vote', 'war', 'law', 'tax', 'one']);

  function stem(w) {
    if (/^\d+$/.test(w)) return w;
    if (w.length > 5 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
    if (w.length > 4 && w.endsWith('ing')) return w.slice(0, -3);
    if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith('es') && /(ss|sh|ch|x|z)es$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss') && !w.endsWith('us')) return w.slice(0, -1);
    return w;
  }
  function contentTokens(norm) {
    return norm.split(' ').filter(t => t && (!STOP.has(t) || KEEP.has(t))).map(stem);
  }

  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (Math.abs(m - n) > 2) return 3;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function tokMatch(want, have) {
    if (want === have) return true;
    if (/^\d+$/.test(want) || /^\d+$/.test(have)) return false;
    const L = Math.min(want.length, have.length);
    if (L >= 8) return lev(want, have) <= 2;
    if (L >= 5) return lev(want, have) <= 1;
    // short words: allow prefix match of stems (e.g., "democrat" vs "democratic" handled by length rule above)
    return false;
  }
  function prefixMatch(want, have) {
    // "democrat" ~ "democratic", "japan" ~ "japanese"
    const a = want.length <= have.length ? want : have, b = a === want ? have : want;
    return a.length >= 5 && b.startsWith(a);
  }
  const FILLER = new Set(['sir','maam','madam','officer','please','thank','thanks','yes','yeah','sure','mean','guess','sorry','oh','correct','right','because','think']);

  // Parse an official answer variant into required token sets
  function parseVariant(v) {
    const raw = String(v).replace(/\[[^\]]*\]/g, ' ');
    const required = normalize(raw.replace(/\([^)]*\)/g, ' '));
    const full = normalize(raw.replace(/[()]/g, ' '));
    let req = unique(contentTokens(required));
    if (req.length > 1) req = req.filter(t => t !== 'usa'); // "of the United States" is a modifier, not the answer
    return { text: v, req, full: unique(contentTokens(full)) };
  }
  function unique(a) { return Array.from(new Set(a)); }

  function needCount(nTokens, strict) {
    if (strict || nTokens <= 2) return nTokens;
    return Math.ceil(nTokens * 0.6);
  }

  // Which required tokens of a variant appear in the answer tokens?
  // Returns the ANSWER tokens that satisfied variant tokens (one per variant token hit)
  function coverage(variantTokens, answerTokens) {
    const hit = [];
    for (const w of variantTokens) {
      const h = answerTokens.find(h => tokMatch(w, h) || prefixMatch(w, h));
      if (h !== undefined) hit.push(h);
    }
    return hit;
  }

  function variantMatches(pv, ansToks, ansNorm, strict) {
    if (!pv.req.length) return null;
    // "Vice President" must not count as "President"
    if (ansToks.includes('vicepresident') && pv.req.includes('president') && !pv.req.includes('vicepresident')) {
      const others = ansToks.filter(t => t === 'president');
      if (!others.length) return null;
    }
    const hit = coverage(pv.req, ansToks);
    if (hit.length >= needCount(pv.req.length, strict)) return hit;
    const fullT = pv.full.length > 1 ? pv.full.filter(t => t !== 'usa') : pv.full;
    const hitF = coverage(fullT, ansToks);
    if (fullT.length > pv.req.length && hitF.length >= needCount(fullT.length, strict) && hitF.length >= pv.req.length) return hitF;
    return null;
  }

  const NEGATIVE = /\b(i dont know|dont know|no idea|not sure|i forgot|forget|pass|skip|next question)\b/;

  /**
   * Grade a civics answer.
   * q = { a: [variants], need: n, strict: bool, extra: [variants also accepted] }
   * returns { correct, matched: [variant texts], count }
   */
  function gradeCivics(q, answer) {
    const ansNorm = normalize(answer);
    if (!ansNorm.trim()) return { correct: false, matched: [], count: 0, reason: 'empty' };
    const ansToks = contentTokens(ansNorm);
    const variants = (q.a || []).concat(q.extra || []).map(parseVariant);
    const need = q.need || 1;
    const matched = []; const used = new Set();
    for (const pv of variants) {
      const hit = variantMatches(pv, ansToks, ansNorm, q.strict);
      if (!hit) continue;
      if (need > 1) {
        // each counted variant must contribute at least one token not already used by another counted variant
        const fresh = hit.filter(t => !used.has(t));
        if (!fresh.length) continue;
        hit.forEach(t => used.add(t));
      }
      matched.push(pv.text);
    }
    let count = matched.length;
    if (need > 1) count = Math.min(count, distinctItems(matched, q));
    const neg = NEGATIVE.test(ansNorm) && count === 0;
    // Precision: if the answer is mostly about something else, do not accept it on one shared word.
    let extras = [];
    if (count >= need) {
      const U = unique([].concat(contentTokens(normalize(q.q || '')), ...variants.map(v => v.full)));
      extras = unique(ansToks).filter(t => !FILLER.has(t) && !U.some(u => tokMatch(u, t) || prefixMatch(u, t)));
      const explained = unique(ansToks).filter(t => t !== 'usa').length - extras.length;
      if (extras.length && extras.length >= explained) return { correct: false, matched, count, extras, reason: 'offtopic' };
    }
    return { correct: count >= need && !neg, matched, count, extras };
  }

  // ---------- Yes / No ----------

    readNext: 'Please read the next sentence out loud.',

    ack: 'In a real interview, the officer asks you to sign your name. Today, please do not sign. Check the box to continue.',

    if (key === 'living') st.working = skipped || (known && /\b(not working|unemploy|retired|retire|dont work|do not work|no job|student|disab|homemaker|stay at home|housewife)\b/.test(n)) ? 'no' : 'yes';
    if (key === 'travel') {
      if (skipped) st.travel = 'no';
      else if (!known) st.travel = 'yes';
      else { const c = E.parseCount(text), y = E.parseYesNo(text); st.travel = c !== null ? (c > 0 ? 'yes' : 'no') : (/\b(none|never|no trips|zero)\b/.test(n) || y === 'no' ? 'no' : 'yes'); }
    }
    if (key === 'maleUS') st.maleUS = yn === 'yes' ? 'yes' : 'no';
  }
  function commitQ(text, method) {
    const s = S, st = cur(), item = st.item, known = method !== 'self';
    s.stats.answered++; countMethod(method);
    let yn = null;
    if (known && item.kind === 'yesno') { yn = E.parseYesNo(text); if (yn !== 'yes' && yn !== 'no') s.stats.unclearYN++; }
    if (known && item.kind === 'open') { s.stats.openAnswered++; if (E.wordCount(text) <= 2) s.stats.shortOpen++; }
    // Branching only. The words of a personal answer are not kept after this function returns.
    if (item.set) setState(item.set, known ? text : null, yn, false);
    const extra = [];
    if (item.afterYes && yn === 'yes') extra.push({ t: 'say', text: item.afterYes, sec: st.sec });
    if (item.followYes && (yn === 'yes' || (!known && item.kind === 'yesno'))) extra.push({ t: 'q', sec: st.sec, item: { id: item.id + 'f', kind: 'open', q: item.followYes, ifYes: !known } });
    if (extra.length) s.steps.splice(s.i + 1, 0, ...extra);
    if (!s.fb) return next();
    const fb = [];
    if (known && item.kind === 'yesno' && yn !== 'yes' && yn !== 'no') fb.push(`<p>${L('fb.clearYN')}</p>`);
    if (item.model) fb.push(`<p><span class="lbl">${L('fb.example')}</span><br>${EN(item.model)}</p>`);
    if (item.defineTerm && C.GLOSSARY[item.defineTerm]) fb.push(`<p><span class="lbl">${L('fb.meaning')}</span><br>${EN('“' + item.defineTerm + '” means: ' + C.GLOSSARY[item.defineTerm].def + '.')}</p>`);
    if (!fb.length) fb.push(`<p>${L(known ? 'fb.ok' : 'fb.okSelf')}</p>`);
    s.turn = { mode: 'done', fb: `<div class="fb">${fb.join('')}</div>` };
    paint(); focusPanel();
  }
  function commitSkip() {
    const s = S, st = cur(); if (!st || st.t !== 'q') return;
    s.stats.skipped++;
    if (st.item.set) setState(st.item.set, null, null, true);
    next();
  }
  function commitCiv(text, method, selfMark) {
    const s = S, st = cur(), c = s.civ, q = st.q;
    let status, detail = null;
    if (q.unscored) status = 'check';
    else if (method === 'self') status = selfMark ? 'selfYes' : 'selfNo';
    else if (method === 'none') status = 'wrong';
    else { detail = E.scoreCivics(q, text); status = detail.status; }
    const said = method === 'self' || method === 'none' ? '' : text;
    const item = { n: q.n, q: q.q, said, status, method, display: q.display, need: q.need, unscored: q.unscored, reason: detail && detail.reason, count: detail ? detail.count : 0 };
    c.items.push(item); c[status]++; countMethod(method);
    if (c.format === 'test') {
      if (c.correct + c.selfYes >= c.rules.passAt) c.done = 'pass';

  function modelAnswer(item) {

  function commitRead(text, method, selfPass) {

  // ---------------------------------------------------------------- Painting the practice screen

  // ---------------------------------------------------------------- Results
  function tag(cls, text) { return `<span class="tag ${cls}">${text}</span>`; }
  function civOutcome(c, partial) {

    if (c.format !== 'test') return t('civ.out.drill');
    if (partial && !c.done) return t('civ.out.partial', { asked: c.items.length, max: c.rules.ask });
    if (selfN) return t('civ.out.self', { yes: c.selfYes, no: c.selfNo });
    if (c.done === 'pass') return t('civ.out.pass', { n: c.rules.passAt }) + (c.check ? ' ' + t('civ.out.alsoCheck', { n: c.check }) : '');
    if (c.done === 'stop') return t('civ.out.stop', { n: c.rules.failAt }) + (c.check ? ' ' + t('civ.out.alsoCheck', { n: c.check }) : '');
    return t('civ.out.unverified', { n: c.check });
  }
  function missedList(c) { return c.items.filter(i => i.status === 'wrong' || i.status === 'selfNo' || i.status === 'check'); }
  function paintResults(focus) {
    const s = S, x = s.stats, cards = [];
    const methods = x.spoken + x.typed + x.edited + x.self;
    if (x.asked) {
      const tips = [];
      if (x.repeats) tips.push(t('res.tip.repeat', { n: x.repeats }));
      if (x.unclearYN) tips.push(t('res.tip.yn', { n: x.unclearYN }));
      if (x.openAnswered >= 3 && x.shortOpen / x.openAnswered > 0.4) tips.push(t('res.tip.sentence'));
      if (x.skipped) tips.push(t('res.tip.skipped', { n: x.skipped }));

      cards.push(`<div class="rcard"><h2>${L('res.talk.title')}</h2>

        ${looked.length ? `<p class="lbl">${L('res.words')}</p><ul lang="en">${looked.map(k => `<li><b>${esc(k)}</b>: ${esc(C.GLOSSARY[k].def)}</li>`).join('')}</ul>` : ''}
        <p class="fine">${L('res.talk.scope')}</p></div>`);

    if (s.read) {

        ${r.tries.length ? `<ul>${r.tries.map(v => `<li>${v.pass ? tag('ok', '✔') : tag('bad', '✖')} ${EN(v.sentence)} ${tag('', L('method.' + v.method))}${!v.pass && v.missing.length ? `<br><span class="fine">${L('read.missing')} ${EN(v.missing.join(', '))}</span>` : ''}</li>`).join('')}</ul>` : ''}
        <p class="fine">${L('res.read.scope')}</p></div>`);
    }
    if (s.write) {
      const w = s.write;
      const line = w.skipped ? t('res.write.skipped') : w.copy ? t('res.write.copy') : !w.tries.length ? t('res.notReached') : w.pass ? t('res.write.pass') : t('res.write.notYet');
      cards.push(`<div class="rcard"><h2>${L('res.write.title')}</h2><p>${esc(line)}</p>
        ${w.tries.length ? `<ul>${w.tries.map(v => `<li>${v.method === 'copy' ? tag('', L('method.copy')) : v.pass ? tag('ok', '✔') : tag('bad', '✖')} ${EN(v.sentence)}</li>`).join('')}</ul>` : ''}
        <p class="fine">${L('res.write.scope')}</p></div>`);
    }
    let missed = [];
    if (s.civ) {
      const c = s.civ; missed = missedList(c);
      const row = i => `<li><b lang="en">${esc(i.q)}</b>${i.said ? `<br>${L('fb.youAnswered')} ${EN(i.said)}` : ''}
        ${i.display.length ? `<br>${L(i.need > 1 ? 'civ.modelN' : 'civ.model', { n: i.need })} ${EN(i.display.slice(0, Math.max(i.need, 3)).join('; '))}` : ''}
        ${i.status === 'check' ? `<br><span class="fine">${L(i.unscored === 'district' ? 'civ.district' : i.unscored === 'stale' ? 'civ.stale' : 'civ.checkWhy')}</span>` : ''}</li>`;
      const wrong = c.items.filter(i => i.status === 'wrong' || i.status === 'selfNo'), chk = c.items.filter(i => i.status === 'check');
      cards.push(`<div class="rcard"><h2>${L('res.civ.title')}</h2>
        <p><b>${esc(civLabel(c))}</b></p>
        <p class="tally">${tag('ok', L('res.civ.correct', { n: c.correct }))}${tag('bad', L('res.civ.wrong', { n: c.wrong }))}${c.check ? tag('chk', L('res.civ.check', { n: c.check })) : ''}${c.selfYes + c.selfNo ? tag('', L('res.civ.self', { n: c.selfYes + c.selfNo })) : ''}</p>
        <p>${esc(civOutcome(c, s.partial))}</p>
        ${wrong.length ? `<h3>${L('res.civ.study')}</h3><ol>${wrong.map(row).join('')}</ol>` : ''}
        ${chk.length ? `<h3>${L('res.civ.toCheck')}</h3><ol>${chk.map(row).join('')}</ol>` : ''}
        ${c.items.length && !wrong.length && !chk.length ? `<p>${L('res.civ.allGood')}</p>` : ''}
        ${!c.items.length ? `<p>${L('res.notReached')}</p>` : ''}
        <p class="fine">${L('res.civ.scope')} ${L('res.civ.verified', { date: C.OFFICIALS.verifiedOn, state: C.OFFICIALS.state })}</p></div>`);
    }
    app.innerHTML = `<section class="screen results">
      <h1 id="rh" tabindex="-1">${L('res.title')}</h1>
      <p class="lead">${esc(sessionLabel(s))}</p>
      ${s.partial ? `<p class="warn">${L('res.partial')}</p>` : ''}
      <p class="note">${L('res.practiceOnly')}</p>
      ${cards.join('') || `<p>${L('res.none')}</p>`}
      ${methods ? `<div class="rcard"><h2>${L('res.how.title')}</h2><ul>
        <li>${L('res.how.spoken', { n: x.spoken })}</li><li>${L('res.how.typed', { n: x.typed + x.edited })}</li><li>${L('res.how.self', { n: x.self })}</li></ul>
        <p class="fine">${L('res.how.note')}</p></div>` : ''}
      <div class="stack">
        ${missed.length ? `<button class="big primary" data-act="retrymissed">🔁 ${L('btn.missed', { n: missed.length })}</button>` : ''}
        <button class="big ${missed.length ? '' : 'primary'}" data-act="chooser">${L('btn.another')}</button>
        <button class="big" data-act="again">${L('btn.again')}</button>
        <button class="big" data-act="clear">🗑️ ${L('btn.finishClear')}</button>
      </div>
      <p class="privacy">🔒 ${L(Mic.remote && S.stats.spoken ? 'privacy.resultsRemote' : 'privacy.results')}</p>
    </section>`;
    if (focus) { window.scrollTo(0, 0); const h = $('#rh'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) {} } }
  }

  // ---------------------------------------------------------------- Exit dialog
  let modalEl = null, modalReturn = null;
  function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
  function openExit() {
    if (!S) return;
    Mic.abort(); Voice.cancel();
    if (S.turn && S.turn.mode === 'listening') { S.turn = { mode: restMode(), method: 'typed', text: '' }; paint(); }
    closeModal();
    modalReturn = document.activeElement;
    modalEl = document.createElement('div');
    modalEl.className = 'modal';
    modalEl.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="mh"><h2 id="mh">${L('exit.title')}</h2>
      <p>${L('exit.body')}</p>
      <button class="big primary" data-act="mkeep">${L('exit.keep')}</button>
      <button class="big" data-act="mresults">${L('exit.results')}</button>
      <button class="big bad" data-act="mclear">${L('btn.exit')}</button></div>`;
    document.body.appendChild(modalEl);
    modalEl.querySelector('button').focus();
  }
  document.addEventListener('keydown', e => {
    if (!modalEl) return;
    if (e.key === 'Escape') { closeModal(); if (modalReturn && modalReturn.focus) modalReturn.focus(); return; }
    if (e.key === 'Tab') {
      const f = Array.from(modalEl.querySelectorAll('button')); const i = f.indexOf(document.activeElement);
      e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });

  // ---------------------------------------------------------------- Actions (one delegated listener)
  function listen() {
    const s = S, st = cur(); if (!st) return;
    PREF = 'speak';
    const tn = s.turn = { mode: 'listening' };
    paint(); focusPanel();
    const mine = () => S === s && s.turn === tn;      // a late result cannot touch another question or session
    Mic.start({
      oninterim: text => { if (!mine()) return; const el = $('#interim'); if (el) el.textContent = text; },
      onresult: text => { if (!mine()) return; s.turn = { mode: 'heard', text, method: 'spoken' }; paint(); focusPanel(); },
      onfail: kind => { if (!mine()) return; s.turn = { mode: 'fail', kind }; paint(); focusPanel(); },
    });
  }
  const ACT = {
    // navigation
    home: () => nav('home'), chooser: () => nav('chooser'),
    go: b => nav(b.dataset.view),
    startclass: () => start('class'),
    startkind: b => start(b.dataset.kind, b.dataset.long ? { long: true } : {}),
    lang: null,
    // civics + mock setup
    civclass: () => start('civics', { civ: { set: 'class' } }),
    civofficial: () => { V.step = 'date'; V.special = !!($('#sp') && $('#sp').checked); show(V.name, true); },
    filed: b => { V.bank = E.bankForFilingDate(b.dataset.date); V.sample = false; V.step = 'format'; show(V.name, true); },
    unsure: () => { V.step = 'unsure'; V.bank = null; show(V.name, true); },
    sample: b => { V.bank = b.dataset.bank; V.sample = true; if (V.name === 'mock') { V.step = 'format'; show(V.name, true); } else start('civics', { civ: { set: 'official', bank: V.bank, special: V.special, sample: true, format: 'drill' } }); },
    redate: () => { V.step = V.name === 'mock' ? '' : 'date'; V.bank = null; V.sample = false; V.nociv = false; show(V.name, true); },
    civstart: b => start('civics', { civ: { set: 'official', bank: V.bank, special: V.special, sample: false, format: b.dataset.format } }),
    mockstart: () => start('mock', { civ: V.nociv ? null : { bank: V.bank, special: V.special, sample: V.sample } }),
    mocknociv: () => { V.nociv = true; V.step = 'format'; show(V.name, true); },
    special: b => { V.special = b.checked; },
    voice: () => { Voice.muted = !Voice.muted; Voice.cancel(); V.more = true; show(V.name); const b = $('[data-act="voice"]'); if (b) b.focus(); },
    installmic: () => { Mic.install(); },
    // answering
    speak: () => { if (Mic.remote && !speechOK) { S.turn = { mode: 'consent' }; paint(); return focusPanel(); } listen(); },
    consentok: () => { speechOK = true; listen(); },
    stopmic: () => Mic.stop(),
    cancelmic: () => { Mic.abort(); S.turn = { mode: 'idle' }; paint(); focusPanel(); },
    type: () => { PREF = 'type'; S.turn = { mode: 'typing', text: '', method: 'typed', focusInput: true }; paint(); },
    edit: () => { S.turn = { mode: 'typing', text: S.turn.text, method: 'edited', focusInput: true }; paint(); },
    use: () => { const tn = S.turn; if (tn.mode === 'heard') commit(tn.text, 'spoken'); },
    self: () => { Mic.abort(); S.turn = { mode: 'self' }; paint(); focusPanel(); },
    back: () => { S.turn = { mode: 'idle' }; paint(); focusPanel(); },
    selfdone: () => { const st = cur(); if (st.t === 'q') return commitQ('', 'self'); Voice.cancel(); S.turn = { mode: 'selfcheck' }; paint(); focusPanel(); },
    selfyes: () => { const st = cur(); if (st.t === 'read') commitRead('', 'self', true); else commitCiv('', 'self', true); },
    selfno: () => { const st = cur(); if (st.t === 'read') commitRead('', 'self', false); else commitCiv('', 'self', false); },
    skip: () => commitSkip(),
    dontknow: () => commitCiv('', 'none', null),
    next: () => { const s = S, tn = s.turn; if (tn && tn.again) { s.turn = { mode: 'idle' }; paint(true); return speakStep(); } next(); },
    ack: () => { const b = $('#ackbox'); if (b && b.checked) return next(); const e = $('#ackerr'); if (e) e.hidden = false; },
    replay: () => { if (S.turn && S.turn.mode === 'listening') { Mic.abort(); S.turn = { mode: 'idle' }; paint(); } speakStep(); },
    reveal: () => { S.reveal = true; paint(); const q = $('#qtext'); if (q) q.focus(); },
    altq: () => { S.alt = 1; S.stats.repeats++; if (S.turn.mode === 'listening') { Mic.abort(); S.turn = { mode: 'idle' }; } paint(); speakStep(); },
    // writing
    play: () => {
      const s = S, w = s.write, sentence = w.list[w.idx];
      w.phase = 'played'; paint(); focusPanel();
      const ok = Voice.speak(sentence, { rate: 0.8,
        onstart: () => { if (S !== s || s.write !== w) return; w.started = true; const b = $('#wrote'); if (b) b.disabled = false; },
        onend: fine => { if (S !== s || s.write !== w) return; if (!fine && !w.started) { w.phase = 'noaudio'; paint(); focusPanel(); } } });
      if (!ok) { w.phase = 'noaudio'; paint(); focusPanel(); }
    },
    canthear: () => { Voice.cancel(); S.write.phase = 'noaudio'; paint(); focusPanel(); },
    retryaudio: () => { S.write.phase = 'ready'; S.write.started = false; paint(); focusPanel(); },
    wrote: () => { const w = S.write; if (!w.started) return; Voice.cancel(); w.phase = 'check'; paint(); focusPanel(); },
    same: () => { const w = S.write; w.tries.push({ sentence: w.list[w.idx], pass: true, method: 'dictation' }); w.pass = true; next(); },
    different: () => {
      const w = S.write; w.tries.push({ sentence: w.list[w.idx], pass: false, method: 'dictation' }); w.idx++;
      if (w.idx >= w.list.length) return next();
      w.phase = Voice.ready() ? 'ready' : 'noaudio'; w.started = false; paint(true); speakStep();
    },
    copy: () => { Voice.cancel(); S.write.phase = 'copy'; paint(); focusPanel(); },
    copydone: () => { const w = S.write; w.tries.push({ sentence: w.list[w.idx], pass: null, method: 'copy' }); w.copy = true; next(); },
    skipwrite: () => { S.write.skipped = true; next(); },
    // leaving
    exit: () => openExit(),
    mkeep: () => { closeModal(); if (modalReturn && modalReturn.focus) modalReturn.focus(); },
    mresults: () => finish(true),
    mclear: () => nav('home'),
    clear: () => nav('home'),
    again: () => { const k = S.kind, o = S.o; const c = o.civ ? Object.assign({}, o.civ) : null; start(k, c ? Object.assign({}, o, { civ: c }) : Object.assign({}, o)); },
    retrymissed: () => { const c = S.civ, list = missedList(c).map(i => i.n); start('civics', { civ: { set: 'missed', bank: c.bank, special: c.special, list } }); },
  };
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = ACT[b.dataset.act]; if (!fn) return;
    if (b.tagName !== 'INPUT') e.preventDefault();
    const needsSession = !/^(home|chooser|go|startclass|startkind|civclass|civofficial|filed|unsure|sample|redate|civstart|mockstart|mocknociv|special|voice|installmic)$/.test(b.dataset.act);
    if (needsSession && !S) return;
    fn(b, e);
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target; if (!S || !f || f.dataset.form !== 'answer' || !S.turn || S.turn.mode !== 'typing') return;
    const inp = $('#ans'), text = (inp.value || '').replace(/\s+/g, ' ').trim(), method = S.turn.method || 'typed';
    if (!text) { S.turn.err = true; S.turn.focusInput = true; return paint(); }
    inp.value = '';
    commit(text, method);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'lang') { if (CFG.languages.includes(el.value)) { LANG = el.value; document.documentElement.lang = LANG; document.title = CFG.title; show(V.name); const sel = $('#lang'); if (sel) sel.focus(); } }
    if (el.id === 'sp') V.special = el.checked;
  });
  document.addEventListener('toggle', e => {
    const d = e.target;
    if (S && d && d.id === 'helpwords' && d.open) { const st = cur(); if (st && st.t === 'q') (st.item.terms || []).forEach(k => { if (!S.looked.includes(k)) S.looked.push(k); }); S.help = true; }
  }, true);

  // ---------------------------------------------------------------- Views outside a practice session
  function langSelect() {
    if (CFG.languages.length < 2) return '<span></span>';
    return `<label class="lang"><span class="vh">${L('lang.label')}</span><select id="lang">` +
      CFG.languages.map(c => `<option value="${c}" lang="${c}" ${c === LANG ? 'selected' : ''}>${esc(I18N[c]['lang.name'])}</option>`).join('') + '</select></label>';
  }
  const top = back => `<div class="toprow">${back ? `<button class="back" data-act="${back}">← ${L('btn.back')}</button>` : '<span></span>'}${langSelect()}</div>`;
  const privacy = () => `<p class="privacy">🔒 ${L(Mic.remote ? 'privacy.remote' : 'privacy.short')}</p>`;
  const scope = () => `<p class="fine">${L('scope.english')} ${ext(CFG.links.exceptions, L('link.exceptions'))}</p>`;
  function dateButtons() {
    // The two buttons stand for the two sides of the October 20, 2025 filing date. No date is typed or stored.
    return `<h2 id="vh" tabindex="-1">${L('date.q')}</h2>
      <button class="big" data-act="filed" data-date="2025-10-19">${L('date.before')}</button>
      <button class="big" data-act="filed" data-date="2025-10-20">${L('date.after')}</button>

  }
  const specialBox = () => `<label class="check"><input type="checkbox" id="sp" ${V.special ? 'checked' : ''}><span>${L('civ.6520.label')}<br><span class="fine">${L('civ.6520.note')}</span></span></label>`;
  function rulesLine() {
    const r = E.civicsRules(V.bank, V.special);
    return t('civ.rules', { bank: bankName(V.bank), ask: r.ask, pass: r.passAt }) + (V.special ? ' ' + t('civ.6520.on') : '');
  }
  function unsureBlock(mock) {
    return `<h2 id="vh" tabindex="-1">${L('unsure.title')}</h2>
      <p>${L('unsure.body')} ${ext(CFG.links.testUpdates, L('link.testUpdates'))}</p>

      ${mock ? `<button class="big" data-act="mocknociv">${L('unsure.nociv')}</button>` : ''}
      <button class="big" data-act="chooser">${L('btn.another')}</button>
      <button class="link" data-act="redate">${L('unsure.back')}</button>`;
  }
  const VIEWS = {
    home() {
      const vs = !Voice.ok ? 'voice.none' : Voice.muted ? 'voice.muted' : Voice.ready() ? 'voice.on' : 'voice.textOnly';
      return `<section class="screen home">${top(null)}

        <p class="lead">${L('home.lead')}</p>
        <button class="big primary" data-act="startclass">▶ ${L('home.startClass')}</button>
        <button class="big" data-act="chooser">${L('home.oneSection')}</button>
        <button class="big col" data-act="go" data-view="mock">${L('home.mock')}<small>${L('home.mock.sub')}</small></button>
        ${privacy()}
        <details class="more" ${V.more ? 'open' : ''}><summary>${L('home.more')}</summary>

        </details>
        <details class="more"><summary>${L('home.micHelp')}</summary>
          <p><b>${L('mic.status')}</b> ${L(Mic.state === 'ready' && Mic.remote ? 'mic.readyRemote' : 'mic.' + Mic.state)}</p>
          ${Mic.state === 'needs-pack' ? `<button class="big" data-act="installmic">${L('mic.install')}</button>` : ''}
          <ul><li>${L('mic.help1')}</li><li>${L(Mic.remote ? 'mic.help2r' : 'mic.help2')}</li><li>${L('mic.help3')}</li><li>${L('mic.help4')}</li></ul>

        ${b('startkind', 'data-kind="about"', 'label.about', 'chooser.about.sub')}
        ${b('startkind', 'data-kind="reading"', 'sec.reading', 'chooser.reading.sub')}
        ${b('startkind', 'data-kind="writing"', 'sec.writing', 'chooser.writing.sub')}

    },
    class() {
      return `<section class="screen">${top('home')}

        <ul><li>${L('class.b1')}</li><li>${L('class.b2')}</li><li>${L('class.b3')}</li></ul>

      else if (V.step === 'unsure') body = unsureBlock(false);

  function show(name, focus) {
    if (!Object.prototype.hasOwnProperty.call(VIEWS, name)) name = 'home';

    document.documentElement.lang = LANG;
    app.innerHTML = VIEWS[name]();
    if (focus) { window.scrollTo(0, 0); const h = $('#vh'); if (h) { try { h.focus({ preventScroll: true }); } catch (e) {} } }
  }

  // ---------------------------------------------------------------- Routes (allowlist; the URL never carries answers or scores)
  const ROUTES = { 'class-practice': 'class', 'civics': 'civics', 'have-you-ever': 'hye', 'mock-interview': 'mock' };
  const FRAG = { class: 'class-practice', civics: 'civics', hye: 'have-you-ever', mock: 'mock-interview' };
  const basePath = () => location.pathname + location.search;
  function nav(view) {
    teardown();
    V = { name: view };
    try { history.pushState({ v: view }, '', basePath() + (FRAG[view] ? '#' + FRAG[view] : '')); } catch (e) {}
    show(view, true);
  }
  function fromLocation() {
    teardown();
    const h = location.hash.replace(/^#/, '');
    let st = null; try { st = history.state && history.state.v; } catch (e) {}
    let view = 'home';
    if (h === '') view = st === 'chooser' ? 'chooser' : 'home';
    else if (Object.prototype.hasOwnProperty.call(ROUTES, h)) view = ROUTES[h];
    else { try { history.replaceState(null, '', basePath()); } catch (e) {} }   // unknown or malformed fragment: go home safely
    V = { name: view };
    show(view, true);
  }
  window.addEventListener('popstate', fromLocation);
  window.addEventListener('hashchange', fromLocation);
  // Leaving the page (or freezing it in the back/forward cache) erases everything, including what is on screen.
  window.addEventListener('pagehide', () => { teardown(); app.innerHTML = ''; });
  window.addEventListener('pageshow', e => { if (e.persisted) fromLocation(); });
  // Screen lock or tab switch: stop the microphone and the voice, and drop any unconfirmed draft.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'hidden') return;
    Mic.abort(); Voice.cancel();
    const st = cur();
    if (st && S.turn && (S.turn.mode === 'listening' || S.turn.mode === 'heard')) { S.turn = { mode: 'idle' }; paint(); }
  });

  document.title = CFG.title;
  fromLocation();
  Mic.verify();
})();
</script>
</body>
</html>
